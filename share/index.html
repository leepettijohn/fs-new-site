<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shared Pages</title>
<style>
  :root { --bg:#f7f6f3; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1e1e1e; --ink:#f1f1f1; --muted:#9a9aa0; --line:#2e2e2e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 12px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Shared Pages</h1>
  <p>Nothing here yet.</p>
  <div class="note">
    This is a placeholder. On the next Netlify deploy it is replaced automatically
    with the PIN-protected list of everything in the <code>share/</code> folder.
  </div>
</main>
</body>
</html>
